    - generic [ref=e53]:
      - paragraph [ref=e54]:
        - img "about us" [ref=e55]
      - generic [ref=e56]:
        - paragraph [ref=e57]:
          - link [ref=e58] [cursor=pointer]:
            - /url: https://www.saaa.org.sg/wp-content/uploads/2015/03/history.jpg
            - img "history" [ref=e59]
        - paragraph [ref=e60]: Established on 21 April 1971, Madam Mary Wu, Managing Director of Singapore Baggage Transport Agency Pte Ltd, formed the Singapore Aircargo Agents Association (SAAA). Its purpose was to advocate the promotion, protection and development of the business of carriage of goods by air transportation, as well as enhancing competiveness of the Air Cargo Forwarding business.
        - paragraph [ref=e61]: "SAAA was an amalgamation of six pioneering cargo agents. The members of the first Board comprised of:"
        - paragraph [ref=e62]
        - list [ref=e63]:
          - listitem [ref=e64]: Mary Wu (Chairman) Singapore Baggage Transport Agency Pte Ltd
        - paragraph [ref=e65]
        - list [ref=e66]:
          - listitem [ref=e67]: Amir Kassim (Deputy Chairman) Air Cargo International Pte Ltd
        - paragraph [ref=e68]
        - list [ref=e69]:
          - listitem [ref=e70]: Cheah Eng Lin (Honorary Treasurer) Sam Foo Transport (Travel Service) Company Pte Ltd
        - paragraph [ref=e71]
        - list [ref=e72]:
          - listitem [ref=e73]: Gustav Patrick Sims (Honorary Secretary) Singapore Baggage Transport Agency Pte Ltd
        - paragraph [ref=e74]
        - list [ref=e75]:
          - listitem [ref=e76]: Paul Armstrong K.C. Dat (S) Pte Ltd
        - paragraph [ref=e77]
        - list [ref=e78]:
          - listitem [ref=e79]: Siew Weng Joo Singapore Baggage Transport Agency Pte Ltd
        - paragraph [ref=e80]
        - list [ref=e81]:
          - listitem [ref=e82]: Jackie Chua Hecny Transportation Pte Ltd
        - paragraph [ref=e83]
        - list [ref=e84]:
          - listitem [ref=e85]: Alan C.Y. Low Central Air-Cargo Agency Pte Ltd
        - paragraph [ref=e86]
        - paragraph [ref=e87]: In the 70s, numerous new international agents were setting up their offices in Singapore. This became a growing concern for the local agents and it prompted SAAA to step in and help upgrade their services and skills to meet new challenging demands.
        - paragraph [ref=e88]: "SAAA had since grown its membership base and work closely with various Government bodies and organisations to develop and propel the local Air Transportation industry. SAAA Cargo Services Pte Ltd was formed in 1988 as the commercial arm of SAAA to provide the following services to the industry:"
        - paragraph [ref=e89]
        - list [ref=e90]:
          - listitem [ref=e91]: Tradenet Documentations
        - list [ref=e92]:
          - listitem [ref=e93]: Training courses (Accredited IATA Training Center)
        - list [ref=e94]:
          - listitem [ref=e95]: Sale of Bar Code Labels
        - list [ref=e96]:
          - listitem [ref=e97]: Neutral Airway Bills
        - list [ref=e98]:
          - listitem [ref=e99]: Issuing of Certificate of Origin
        - paragraph [ref=e100]
        - paragraph [ref=e101]: 2013 marks a significant year for SAAA. A rebranding exercise was completed and on 1 October, SAAA@Singapore was officially launched by Mrs. Josephine Teo, Senior Minister of State, Ministry of Transport and Ministry of Finance. The significant change is that SAAA@Singapore can now encompass all air logistics related sectors to better represent the industry.
        - paragraph [ref=e102]
